      - category: envoy.retry_host_predicates
        name: envoy.retry_host_predicates.omit_canary_hosts
        type_urls:
        - envoy.extensions.retry.host.omit_canary_hosts.v3.OmitCanaryHostsPredicate
      - category: envoy.retry_host_predicates
