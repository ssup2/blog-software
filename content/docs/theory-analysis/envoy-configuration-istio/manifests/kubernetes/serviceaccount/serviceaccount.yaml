# Applied on top of service-new-port (adds a second server-d Pod with a dedicated ServiceAccount)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: server-d-sa
  namespace: default
---
apiVersion: v1
kind: Pod
metadata:
  name: server-d-2
  namespace: default
  labels:
    app: server-d
spec:
  serviceAccountName: server-d-sa
  containers:
  - name: server-d-2
    image: ghcr.io/ssup2/mock-go-server:commit-f8ad4477
    ports:
    - containerPort: 8080
