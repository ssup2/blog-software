apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-v2
  namespace: server-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
      version: v2
  template:
    metadata:
      labels:
        app: server
        version: v2
    spec:
      containers:
      - name: http-echo
        image: hashicorp/http-echo:1.0
        args:
        - -text=server-v2
        - -listen=:8080
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: server-v2
  namespace: server-namespace
spec:
  selector:
    app: server
    version: v2
  ports:
  - name: http
    port: 8080
    targetPort: 8080
