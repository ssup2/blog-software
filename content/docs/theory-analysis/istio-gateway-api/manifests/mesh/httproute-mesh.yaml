# GAMMA producer route: applies to in-mesh traffic sent to the server Service
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: server-mesh
  namespace: server-namespace
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: server
  rules:
  - backendRefs:
    - name: server-v1
      port: 8080
      weight: 90
    - name: server-v2
      port: 8080
      weight: 10
