<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="710" viewBox="0 0 1120 710" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlack" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#222"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#d33"/>
    </marker>
  </defs>

  <rect width="1120" height="710" fill="white"/>

  <!-- Legend -->
  <line x1="40" y1="30" x2="80" y2="30" stroke="#222" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="88" y="34" font-size="12" fill="#222">Reference (parentRefs, backendRefs, Selector)</text>
  <line x1="380" y1="30" x2="420" y2="30" stroke="#d33" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="428" y="34" font-size="12" fill="#d33">Traffic</text>

  <!-- client Namespace -->
  <rect x="40" y="60" width="300" height="280" fill="none" stroke="#666" stroke-dasharray="6 4"/>
  <text x="52" y="82" font-size="13" font-weight="bold" fill="#444">client Namespace</text>

  <rect x="70" y="100" width="140" height="44" fill="#f5f5f5" stroke="#222"/>
  <text x="140" y="127" font-size="13" text-anchor="middle">Client Pod</text>

  <rect x="70" y="190" width="240" height="100" fill="#fff" stroke="#222"/>
  <text x="190" y="216" font-size="13" font-weight="bold" text-anchor="middle">HTTPRoute (server-consumer)</text>
  <text x="190" y="244" font-size="12" text-anchor="middle">parentRefs: server</text>
  <text x="190" y="266" font-size="12" text-anchor="middle">backendRefs: server</text>

  <!-- server Namespace -->
  <rect x="380" y="60" width="700" height="590" fill="none" stroke="#666" stroke-dasharray="6 4"/>
  <text x="392" y="82" font-size="13" font-weight="bold" fill="#444">server Namespace</text>

  <!-- server Service -->
  <rect x="420" y="100" width="400" height="110" fill="#fff" stroke="#222"/>
  <text x="432" y="120" font-size="13" font-weight="bold">server Service</text>
  <rect x="435" y="130" width="180" height="65" fill="#eef4fb" stroke="#222"/>
  <text x="525" y="152" font-size="12" font-weight="bold" text-anchor="middle">Frontend</text>
  <text x="525" y="176" font-size="11" text-anchor="middle">DNS Name, ClusterIP</text>
  <rect x="625" y="130" width="180" height="65" fill="#fbf3ea" stroke="#222"/>
  <text x="715" y="152" font-size="12" font-weight="bold" text-anchor="middle">Backend</text>
  <text x="715" y="176" font-size="11" text-anchor="middle">Endpoint IPs</text>

  <!-- Consumer Route traffic: Frontend -> Backend -->
  <path d="M 570,130 C 590,104 690,104 710,128" fill="none" stroke="#d33" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="640" y="94" font-size="11" fill="#d33" text-anchor="middle">Traffic by Consumer Route (backendRefs: server)</text>

  <!-- server Pods -->
  <rect x="890" y="135" width="170" height="55" fill="#f5f5f5" stroke="#222"/>
  <text x="975" y="158" font-size="12" text-anchor="middle">Pods</text>
  <text x="975" y="176" font-size="11" text-anchor="middle">(app: server)</text>
  <line x1="805" y1="162" x2="888" y2="162" stroke="#222" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="847" y="152" font-size="10" text-anchor="middle">Selector</text>

  <!-- Client -> Frontend -->
  <line x1="210" y1="122" x2="433" y2="145" stroke="#d33" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="300" y="112" font-size="11" fill="#d33">Request to server DNS</text>

  <!-- Consumer Route -> Frontend (parentRefs) -->
  <line x1="310" y1="240" x2="433" y2="172" stroke="#222" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="352" y="196" font-size="10">parentRefs</text>

  <!-- Producer Route -->
  <rect x="490" y="260" width="270" height="110" fill="#fff" stroke="#222"/>
  <text x="625" y="284" font-size="13" font-weight="bold" text-anchor="middle">HTTPRoute (server-producer)</text>
  <text x="625" y="310" font-size="12" text-anchor="middle">parentRefs: server</text>
  <text x="625" y="332" font-size="12" text-anchor="middle">backendRefs: server-v1 (90%),</text>
  <text x="625" y="350" font-size="12" text-anchor="middle">server-v2 (10%)</text>

  <!-- Producer Route -> Frontend (parentRefs) -->
  <line x1="595" y1="258" x2="562" y2="197" stroke="#222" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="600" y="232" font-size="10">parentRefs</text>

  <!-- server-v1 / server-v2 Services -->
  <rect x="420" y="460" width="200" height="50" fill="#fff" stroke="#222"/>
  <text x="520" y="488" font-size="13" text-anchor="middle">server-v1 Service</text>
  <rect x="690" y="460" width="200" height="50" fill="#fff" stroke="#222"/>
  <text x="790" y="488" font-size="13" text-anchor="middle">server-v2 Service</text>

  <rect x="420" y="580" width="200" height="50" fill="#f5f5f5" stroke="#222"/>
  <text x="520" y="608" font-size="12" text-anchor="middle">Pods (app: server-v1)</text>
  <rect x="690" y="580" width="200" height="50" fill="#f5f5f5" stroke="#222"/>
  <text x="790" y="608" font-size="12" text-anchor="middle">Pods (app: server-v2)</text>

  <line x1="520" y1="510" x2="520" y2="578" stroke="#222" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="528" y="550" font-size="10">Selector</text>
  <line x1="790" y1="510" x2="790" y2="578" stroke="#222" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="798" y="550" font-size="10">Selector</text>

  <!-- Traffic by Producer Route -->
  <line x1="465" y1="195" x2="465" y2="458" stroke="#d33" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="455" y="252" font-size="11" fill="#d33" text-anchor="end">Traffic by Producer Route (90%)</text>
  <polyline points="605,195 605,225 800,225 800,458" fill="none" stroke="#d33" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="810" y="250" font-size="11" fill="#d33">Traffic by Producer Route (10%)</text>

  <!-- Producer Route backendRefs -->
  <line x1="545" y1="370" x2="502" y2="458" stroke="#222" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="548" y="420" font-size="10">backendRefs</text>
  <line x1="695" y1="370" x2="773" y2="458" stroke="#222" stroke-width="1.5" marker-end="url(#arrowBlack)"/>
  <text x="700" y="420" font-size="10">backendRefs</text>

  <!-- Note -->
  <text x="40" y="690" font-size="11" fill="#666">* A Service's Selector does not affect Route attachment. It only composes the Service's Backend, which receives Traffic when the Service is referenced in backendRefs.</text>
</svg>
